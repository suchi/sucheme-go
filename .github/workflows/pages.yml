name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Build WASM
      - name: Build WASM
        run: |
          mkdir -p web-ui/dist
          GOOS=js GOARCH=wasm go build -o web-ui/dist/sucheme.wasm ./cmd/wasm/
          if [ -f "$(go env GOROOT)/misc/wasm/wasm_exec.js" ]; then
            cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" web-ui/dist/
          elif [ -f "$(go env GOROOT)/lib/wasm/wasm_exec.js" ]; then
            cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web-ui/dist/
          fi
          if [ ! -f web-ui/dist/wasm_exec.js ]; then echo "wasm_exec.js not found" >&2; exit 1; fi
          cp web-ui/index.html web-ui/dist/
          cp web-ui/style.css web-ui/dist/
          cp web-ui/app.js web-ui/dist/

      # Generate coverage dashboard
      - name: Generate coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o web-ui/dist/coverage.html
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "Coverage: $COVERAGE"

          # Generate dashboard HTML
          cat > web-ui/dist/dashboard.html << 'DASHEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Sucheme - Test & Coverage Dashboard</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #0d1117; color: #c9d1d9; }
              h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
              h2 { color: #79c0ff; margin-top: 30px; }
              a { color: #58a6ff; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-weight: bold; margin: 5px 0; }
              .green { background: #238636; color: #fff; }
              .yellow { background: #9e6a03; color: #fff; }
              .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin: 15px 0; }
              .links a { display: inline-block; margin-right: 20px; padding: 8px 16px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; }
              .links a:hover { background: #30363d; }
              table { width: 100%; border-collapse: collapse; margin: 10px 0; }
              th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #30363d; }
              th { color: #8b949e; }
            </style>
          </head>
          <body>
            <h1>Sucheme - Test & Coverage Dashboard</h1>
            <div class="links">
              <a href="index.html">Web REPL</a>
              <a href="coverage.html">Coverage Report</a>
              <a href="https://github.com/suchi/sucheme-go">GitHub</a>
              <a href="https://github.com/suchi/sucheme-go/actions">CI/CD</a>
            </div>
            <div class="card">
              <h2>Coverage</h2>
              <p>Full interactive coverage report: <a href="coverage.html">coverage.html</a></p>
              <p>Coverage is generated on every push to main by GitHub Actions.</p>
            </div>
            <div class="card">
              <h2>CI/CD Status</h2>
              <table>
                <tr><th>Job</th><th>Platform</th><th>Description</th></tr>
                <tr><td>test</td><td>ubuntu / macos / windows</td><td>Unit tests + go vet + CLI build</td></tr>
                <tr><td>coverage</td><td>ubuntu</td><td>Coverage report + badge + PR comment</td></tr>
                <tr><td>benchmark</td><td>ubuntu</td><td>Takeuchi, Fibonacci, TCO, List benchmarks</td></tr>
                <tr><td>build-wasm</td><td>ubuntu</td><td>WebAssembly build (CI)</td></tr>
                <tr><td>build</td><td>ubuntu</td><td>WASM + coverage dashboard + Pages deploy</td></tr>
              </table>
            </div>
            <div class="card">
              <h2>Benchmarks</h2>
              <p>Benchmarks run on every push. Results are available as GitHub Actions artifacts.</p>
              <p><a href="https://github.com/suchi/sucheme-go/actions/workflows/ci.yml">View latest benchmark results</a></p>
            </div>
          </body>
          </html>
          DASHEOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-ui/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  pr-preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Web UI + Coverage dashboard artifact uploaded. Download from Actions tab to preview."
