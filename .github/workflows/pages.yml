name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal default permissions
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Build WASM
      - name: Build WASM
        run: |
          mkdir -p web-ui/dist
          GOOS=js GOARCH=wasm go build -o web-ui/dist/sucheme.wasm ./cmd/wasm/
          if [ -f "$(go env GOROOT)/misc/wasm/wasm_exec.js" ]; then
            cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" web-ui/dist/
          elif [ -f "$(go env GOROOT)/lib/wasm/wasm_exec.js" ]; then
            cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web-ui/dist/
          fi
          if [ ! -f web-ui/dist/wasm_exec.js ]; then echo "wasm_exec.js not found" >&2; exit 1; fi
          cp web-ui/index.html web-ui/dist/
          cp web-ui/style.css web-ui/dist/
          cp web-ui/app.js web-ui/dist/

      # Generate coverage for Pages
      - name: Generate coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o web-ui/dist/coverage.html

      # Copy dashboard and inject CI data
      - name: Build dashboard with CI data
        run: |
          cp web-ui/dashboard.html web-ui/dist/dashboard.html
          # Inject build timestamp (target only the visible text, not JS detection code)
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s/Last build: __BUILD_TIMESTAMP__/Last build: $TIMESTAMP/" web-ui/dist/dashboard.html
          # Inject overall coverage percentage
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
            sed -i "s/__COVERAGE_PCT__/$COVERAGE/g" web-ui/dist/dashboard.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-ui/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  pr-preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Web UI + Coverage dashboard artifact uploaded. Download from Actions tab to preview."
