name: CI

on:
  push:
    branches: [main, feature/*, claude/*]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.24.7']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test ./... -v -count=1
      - run: go vet ./...
      - name: Build CLI
        run: go build -o sucheme ./cmd/sucheme/
        shell: bash

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      - run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - run: go tool cover -html=coverage.out -o coverage.html
      - run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=3 ./pkg/evaluator/ | tee benchmark-results.txt
      - name: Run Takeuchi benchmark via CLI
        run: |
          go build -o sucheme ./cmd/sucheme/
          time ./sucheme examples/tak.scm
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o web-ui/sucheme.wasm ./cmd/wasm/
      - name: Copy wasm_exec.js
        run: cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" web-ui/
      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: web-ui/
