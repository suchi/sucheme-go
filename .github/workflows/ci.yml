name: CI

on:
  push:
    branches: [main, feature/*, claude/*]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run tests
        run: go test ./... -v -count=1
      - run: go vet ./...

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o web-ui/sucheme.wasm ./cmd/wasm/
