name: CI

on:
  push:
    branches: [main, feature/*, claude/*]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./... -v -count=1
      - run: go vet ./...
      - name: Build CLI
        run: go build -o sucheme ./cmd/sucheme/
        shell: bash

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: |
          set -o pipefail
          go test -coverprofile=coverage.out -covermode=atomic -v ./... 2>&1 | tee test-output.txt

      - name: Generate coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out > coverage-func.txt
          go tool cover -func=coverage.out | tail -1

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Generate test summary
        if: always()
        run: |
          echo "## Test & Coverage Dashboard" > dashboard.md
          echo "" >> dashboard.md
          if [ -f coverage.out ]; then
            echo "### Coverage: ${{ steps.coverage.outputs.percentage }}%" >> dashboard.md
            echo "" >> dashboard.md
            TOTAL_LINE=$(go tool cover -func=coverage.out | tail -1)
            TOTAL_PCT=$(echo "$TOTAL_LINE" | awk '{print $3}')
            echo "### Total: ${TOTAL_PCT}" >> dashboard.md
            echo "" >> dashboard.md
            echo "| File | Coverage |" >> dashboard.md
            echo "|------|----------|" >> dashboard.md
            go tool cover -func=coverage.out | grep -v "total:" | awk '{split($1,a,":"); file=a[1]} !seen[file]++ {print "| " file " | " $3 " |"}' >> dashboard.md
          else
            echo "Coverage data not available (tests may have failed)." >> dashboard.md
          fi
          echo "" >> dashboard.md
          echo "### Test Results" >> dashboard.md
          echo "" >> dashboard.md
          if [ -f test-output.txt ]; then
            PASS=$(grep -c "^ok" test-output.txt || echo "0")
            FAIL=$(grep -c "^FAIL" test-output.txt || echo "0")
            echo "- **Passed packages**: $PASS" >> dashboard.md
            echo "- **Failed packages**: $FAIL" >> dashboard.md
          else
            echo "Test output not available." >> dashboard.md
          fi

      - name: Post coverage to PR (sticky comment)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.percentage }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- coverage-report -->';
            const body = `${marker}\n## 📊 Test & Coverage Report\n\n**Coverage: ${coverage}%**\n\nDownload the full HTML report from [Actions artifacts](${runUrl}).`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
            coverage-func.txt
            dashboard.md
          if-no-files-found: ignore

      - name: Generate coverage badge data
        if: steps.coverage.outputs.percentage != ''
        run: |
          COVERAGE=${{ steps.coverage.outputs.percentage }}
          mkdir -p .badges
          COLOR=$(awk "BEGIN {
            c = $COVERAGE + 0;
            if (c >= 80) print \"brightgreen\";
            else if (c >= 60) print \"yellow\";
            else if (c >= 40) print \"orange\";
            else print \"red\";
          }")
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > .badges/coverage.json

      - name: Upload badge data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: .badges/coverage.json
          if-no-files-found: ignore

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=3 ./pkg/evaluator/ | tee benchmark-results.txt
      - name: Run Takeuchi benchmark via CLI
        run: |
          go build -o sucheme ./cmd/sucheme/
          time ./sucheme examples/tak.scm
      - name: Generate benchmark summary
        run: |
          echo "## Benchmark Results" > benchmark-summary.md
          echo "" >> benchmark-summary.md
          echo '```' >> benchmark-summary.md
          cat benchmark-results.txt >> benchmark-summary.md
          echo '```' >> benchmark-summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.txt
            benchmark-summary.md

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o web-ui/sucheme.wasm ./cmd/wasm/
      - name: Copy wasm_exec.js
        run: |
          if [ -f "$(go env GOROOT)/misc/wasm/wasm_exec.js" ]; then
            cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" web-ui/
          elif [ -f "$(go env GOROOT)/lib/wasm/wasm_exec.js" ]; then
            cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web-ui/
          else
            echo "wasm_exec.js not found in GOROOT" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: web-ui/
