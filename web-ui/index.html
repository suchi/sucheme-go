<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucheme - R7RS Scheme Interpreter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sucheme</h1>
        <p class="subtitle">R7RS Scheme Interpreter</p>
        <div id="toolbar">
            <div class="toolbar-group">
                <label class="toolbar-label" for="keybind-select">Keys:</label>
                <select id="keybind-select" title="Keybinding mode">
                    <option value="emacs">Emacs</option>
                    <option value="vi">vi</option>
                    <option value="none">None</option>
                </select>
            </div>
            <div class="toolbar-group">
                <button id="theme-toggle-btn" type="button" title="Toggle dark/light theme">Light</button>
            </div>
            <div class="toolbar-group">
                <button id="font-decrease-btn" type="button" title="Decrease font size">A-</button>
                <button id="font-increase-btn" type="button" title="Increase font size">A+</button>
            </div>
        </div>
        <nav>
            <a href="https://github.com/suchi/sucheme-go" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
    </header>

    <main>
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading WASM module...</p>
        </div>

        <div id="repl" class="hidden">
            <div id="output-container">
                <div id="output" aria-label="REPL output"></div>
                <div id="output-controls">
                    <button id="copy-output-btn" type="button" title="Copy output to clipboard">Copy</button>
                    <button id="clear-output-btn" type="button" title="Clear output">Clear</button>
                </div>
            </div>
            <div id="input-area">
                <div id="input-wrapper">
                    <label for="input" class="sr-only">Scheme expression</label>
                    <textarea id="input" placeholder="Type a Scheme expression..." rows="3" spellcheck="false"></textarea>
                    <div id="highlight-overlay" aria-hidden="true"></div>
                </div>
                <div id="vi-mode-indicator" class="hidden">-- INSERT --</div>
                <div id="input-controls">
                    <span class="hint">Ctrl+Enter to evaluate | :help for commands</span>
                    <button id="eval-btn" type="button">Evaluate</button>
                </div>
            </div>
        </div>

        <div id="error-message" class="hidden">
            <p>Failed to load WASM module. Make sure the interpreter has been compiled to WebAssembly.</p>
            <p>You can build it with: <code>make wasm</code></p>
        </div>
    </main>

    <footer>
        <p>Sucheme - A Scheme interpreter written in Go</p>
    </footer>

    <script src="wasm_exec.js"></script>
    <script src="app.js"></script>
</body>
</html>
